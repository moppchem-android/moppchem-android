<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#10b981" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="MoppChem" />
<title>MoppChem accounts — Full Ledger &amp; Multi-Device Sync</title>
<style>
  :root{
    --em: #10b981; --em-600:#059669; --em-700:#047857; --em-50:#ecfdf5;
    --rose:#e11d48; --rose-600:#e11d48; --amber:#f59e0b; --slate:#0f172a;
    --s500:#64748b; --s400:#94a3b8; --s200:#e2e8f0; --s100:#f1f5f9; --s50:#f8fafc;
    --bg:#f4f7f5;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--slate); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-size:15px; -webkit-font-smoothing:antialiased;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  .hide{display:none !important;}

  .wrap{display:flex; min-height:100vh; max-width:1280px; margin:0 auto;}
  /* sidebar */
  .sidebar{position:sticky; top:0; height:100vh; width:240px; flex-shrink:0; border-right:1px solid rgba(226,232,240,.8); background:#fff; padding:20px 12px; display:none;}
  @media(min-width:768px){ .sidebar{display:flex; flex-direction:column;} }
  .brand{display:flex; align-items:center; gap:10px; padding:0 8px; margin-bottom:22px;}
  .brand-logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--em),#0d9488);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;box-shadow:0 4px 12px rgba(16,185,129,.3);}
  .brand-name{font-weight:700; font-size:14px; line-height:1.1;}
  .brand-sub{font-size:11px; color:var(--s400);}
  .nav{display:flex; flex-direction:column; gap:4px; flex:1;}
  .nav-item{display:flex; align-items:center; justify-content:space-between; border:0; background:transparent; padding:10px 12px; border-radius:12px; font-size:14px; font-weight:500; color:#475569; width:100%; text-align:left;}
  .nav-item:hover{background:var(--s50);}
  .nav-item.active{background:var(--em-50); color:#065f46; box-shadow:inset 0 0 0 1px rgba(16,185,129,.15);}
  .nav-item .lbl{display:flex; align-items:center; gap:10px;}
  .nav-ic{width:28px;height:28px;border-radius:9px;background:var(--s100);color:var(--s500);display:flex;align-items:center;justify-content:center;font-size:13px;}
  .nav-item.active .nav-ic{background:var(--em-600); color:#fff;}
  .nav-badge{background:var(--amber);color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:2px 8px;}
  .sidebar-balance{margin-top:16px;background:linear-gradient(135deg,#1e293b,#0f172a);border-radius:16px;padding:16px;color:#fff;}
  .sb-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#94a3b8;}
  .sb-val{font-size:19px;font-weight:700;margin-top:2px;}
  .sb-today{font-size:11px;color:#94a3b8;margin-top:4px;}

  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .mobile-header{position:sticky; top:0; z-index:20; border-bottom:1px solid rgba(226,232,240,.8); background:rgba(255,255,255,.92); backdrop-filter:blur(6px); padding:10px 16px; display:flex; align-items:center; justify-content:space-between;}
  @media(min-width:768px){ .mobile-header{display:none;} }
  .content{flex:1; padding:20px 16px 100px;}
  @media(min-width:768px){ .content{padding:24px 32px 40px;} }

  .statusbar{display:flex; flex-wrap:wrap; align-items:center; gap:10px; background:#fff; border:1px solid rgba(226,232,240,.6); border-radius:12px; padding:10px 14px; margin-bottom:18px; font-size:12px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .dot.on{background:var(--em);} .dot.off{background:var(--amber);}
  .dot.pulse{animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  .card{background:#fff;border:1px solid rgba(226,232,240,.8);border-radius:16px;padding:18px;box-shadow:0 1px 2px rgba(15,23,42,.04);}
  .grid4{display:grid; gap:14px;} @media(min-width:640px){.grid4{grid-template-columns:repeat(2,1fr);}} @media(min-width:1024px){.grid4{grid-template-columns:repeat(4,1fr);}}
  .grid2{display:grid; gap:14px;} @media(min-width:1024px){.grid2{grid-template-columns:1fr 1fr;}}
  .k-label{font-size:12px;color:var(--s500);font-weight:500;}
  .k-value{font-size:22px;font-weight:700;margin-top:2px;}
  .k-sub{font-size:11px;color:var(--s400);margin-top:3px;}

  .seg{display:inline-flex; background:#e2e8f0; border-radius:12px; padding:3px;}
  .seg button{border:0;background:transparent;padding:8px 12px;border-radius:9px;font-size:12px;font-weight:600;color:var(--s500);}
  .seg button.active{background:#fff;color:var(--slate);box-shadow:0 1px 2px rgba(0,0,0,.08);}

  .bar{height:10px;border-radius:999px;background:var(--s100);overflow:hidden;}
  .bar>div{height:100%;border-radius:999px;transition:width .4s;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:#475569;margin-bottom:5px;}
  .inp{width:100%;border:1px solid var(--s200);border-radius:12px;padding:10px 12px;font-size:15px;outline:none;background:#fff;}
  .inp:focus{border-color:var(--em); box-shadow:0 0 0 3px rgba(16,185,129,.15);}
  textarea.inp{min-height:70px;resize:vertical;}
  .radio-row{display:flex;gap:14px;font-size:13px;font-weight:500;color:#475569;align-items:center;}
  .radio-row label{display:flex;align-items:center;gap:5px;cursor:pointer;}
  .formgrid{display:grid; gap:0 12px;} @media(min-width:640px){.formgrid{grid-template-columns:1fr 1fr;}}
  .totbox{background:var(--s50);border-radius:12px;padding:12px;font-size:12px;}
  .totbox .row{display:flex;justify-content:space-between;margin:2px 0;font-weight:500;color:#334155;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 16px;font-size:14px;font-weight:600;background:var(--em-600);color:#fff;}
  .btn:disabled{opacity:.5; cursor:default;}
  .btn.block{width:100%;}
  .btn-ghost{background:var(--s100);color:var(--slate);}
  .btn-rose{background:var(--rose);color:#fff;}
  .btn-sm{padding:7px 12px;font-size:12px;border-radius:10px;}
  .btn-xs{padding:5px 10px;font-size:11px;border-radius:9px;}

  .entry{display:flex;flex-direction:column;gap:8px;padding:14px;border-bottom:1px solid var(--s100);}
  @media(min-width:640px){.entry{flex-direction:row;align-items:center;justify-content:space-between;}}
  .entry:hover{background:var(--s50);}
  .tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:999px;}
  .tag.synced{background:var(--em-100, #d1fae5);color:#047857;}
  .tag.pending{background:#fef3c7;color:#92400e;}
  .tag.unpaid{background:#fef3c7;color:#92400e;}
  .tag.ret{background:#ffe4e6;color:#be123c;}
  .tag.cash{background:var(--s100);color:var(--s500);}
  .tag.income{background:var(--em-100, #d1fae5);color:#047857;}
  .entry-sub{font-size:11px;color:var(--s400);margin-top:2px;}
  .entry-actions{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;}
  .empty{padding:40px;text-align:center;color:var(--s400);font-size:14px;}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .chip{border:1px solid var(--s200);background:#fff;border-radius:999px;padding:7px 14px;font-size:13px;}
  .chip.active{background:var(--em-600);color:#fff;border-color:var(--em-600);}
  .filtergrid{display:grid; gap:10px;} @media(min-width:768px){.filtergrid{grid-template-columns:repeat(4,1fr);} .filtergrid .full{grid-column:span 4;}}

  /* modal */
  .modal{position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; background:rgba(15,23,42,.4); backdrop-filter:blur(3px); padding:16px;}
  .modal-box{background:#fff;border-radius:18px;padding:20px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.2);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--s100);padding-bottom:12px;margin-bottom:14px;}
  .modal-head h3{margin:0;font-size:16px;}
  .close{background:none;border:0;font-size:20px;color:var(--s400);}
  .hist-item{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--s100);border-radius:12px;padding:10px 12px;font-size:12px;margin-bottom:6px;background:#fff;}

  /* bottom nav (mobile) */
  .bottomnav{position:fixed;inset-inline:0;bottom:0;z-index:30;border-top:1px solid var(--s200);background:rgba(255,255,255,.96);backdrop-filter:blur(6px);padding-bottom:env(safe-area-inset-bottom);}
  @media(min-width:768px){ .bottomnav{display:none;} }
  .bottomnav .row{display:flex;justify-content:space-between;}
  .bnav{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;font-size:10px;color:var(--s400);}
  .bnav.active{color:#047857;font-weight:600;}
  .bnav .ic{font-size:16px;}
  .bnav .b{position:absolute;}

  h2.page{font-size:19px;margin:0 0 4px;}
  p.page-sub{margin:0 0 16px;font-size:12px;color:var(--s500);}
  .section-title{font-size:14px;font-weight:700;margin:0 0 10px;}

  @media print{ .no-print{display:none !important;} }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>

<script>
"use strict";

/* =========================================================================
 *  MoppChem accounts — vanilla JS single-file app
 *  - No Babel, no React, no heavy CDN libs  -> fast startup
 *  - Last-writer-wins two-way sync with Google Sheets (via Apps Script)
 *  - Tombstones so deletions propagate and never resurrect
 * ========================================================================= */

const LS_KEY = 'moppchem_ledger_v2';

const DEFAULT_STATE = {
  expenses: [],
  incomes: [],
  categories: ['Food & Dining','Utilities','Transportation','Shopping','Healthcare','Salary / Wages','Misc'],
  incomeCategories: ['Salary','Freelance','Business','Investment','Gift','Rental','Other'],
  baseCapital: 0,
  capitalUpdatedAt: 0,
  tombstones: {},               // { id: deletedAtMs }
  googleSheetsUrl: '',
  deviceId: '',
  lastSyncedAt: null,
  syncError: '',
};

/* ---------------------------------------------------------------- utilities */

const $  = (sel, root) => (root||document).querySelector(sel);
const $$ = (sel, root) => Array.from((root||document).querySelectorAll(sel));

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function money(v){
  const n = Number(v)||0;
  return 'Rs. ' + n.toLocaleString('en-PK', { maximumFractionDigits: 2 });
}
function num(v){ const n=Number(v); return isNaN(n)?0:n; }
function todayStr(){ return new Date().toISOString().split('T')[0]; }
function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function deviceId(){
  if(state.deviceId) return state.deviceId;
  let id = localStorage.getItem('moppchem_device');
  if(!id){ id = 'dev_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); localStorage.setItem('moppchem_device', id); }
  return id;
}
function deepCopy(o){ return o ? JSON.parse(JSON.stringify(o)) : o; }
function sameArr(a,b){
  if(!a||!b) return a===b;
  if(a.length!==b.length) return false;
  return a.every(x=>b.includes(x)) && b.every(x=>a.includes(x));
}
function union(a,b){
  const out = Array.isArray(a)?a.slice():[];
  (Array.isArray(b)?b:[]).forEach(x=>{ if(!out.some(y=>String(y).toLowerCase()===String(x).toLowerCase())) out.push(x); });
  return out;
}
function instTotal(e){ return (e.installments||[]).reduce((s,i)=>s+(num(i.amount)),0); }
function returnsTotal(e){ return (e.returns||[]).reduce((s,r)=>s+(num(r.amount)),0); }

/* capital is DERIVED from entries, so every device computes the same value.
   baseCapital is a single manual baseline that gets synced too. */
function netFromEntries(expenses, incomes){
  let net = 0;
  for(const e of expenses) net += returnsTotal(e) - (num(e.amountPaid));
  for(const i of incomes)  net += (num(i.amountPaid)) - returnsTotal(i);
  return net;
}
function capital(){ return num(state.baseCapital) + netFromEntries(state.expenses, state.incomes); }

/* ---------------------------------------------------------------- state */

let state = {...DEFAULT_STATE};
let saveTimer = null;

/* --- controlled-form draft store ---
   Every keystroke is written here, and every render() restores inputs from it.
   So even if a sync triggers a re-render mid-typing, nothing the user entered
   is ever lost. This is the robust fix for "fields erase during sync". */
let draft = { exp:{}, inc:{}, edit:{}, settle:{}, ret:{} };
function df(scope, field, def){ const v=draft[scope][field]; return (v===undefined||v===null)?def:v; }
function putDraft(el){
  const dp = el && el.dataset ? el.dataset.draft : null;
  if(!dp) return;
  const i = dp.indexOf('.');
  const scope = dp.slice(0,i), field = dp.slice(i+1);
  if(!draft[scope]) draft[scope] = {};
  draft[scope][field] = el.value;
}

/* --- "don't clobber what the user is typing" guard ---
   Background syncs update state + the status bar, but never rebuild the DOM
   while an input/textarea/select is focused. When the user goes quiet (and
   nothing is focused) we render once to catch up. */
let lastInteraction = Date.now();
let quietTimer = null;
function hasFocusedInput(){
  const el = document.activeElement;
  return !!el && /INPUT|TEXTAREA|SELECT/.test(el.tagName);
}
function onInteract(){
  lastInteraction = Date.now();
  clearTimeout(quietTimer);
  quietTimer = setTimeout(()=>{ if(!hasFocusedInput()) render(); }, 1500);
}
function renderIfSafe(){ if(!hasFocusedInput()) render(); }
['focusin','input','change','keydown'].forEach(ev => document.addEventListener(ev, onInteract, true));

/* Update only the sync/online status bar (never the active tab), so a sync
   can run without disturbing anything the user is editing. */
function updateStatusBar(){
  const on = $('#online-label'), m = $('#sync-msg'), ls = $('#last-sync'), dot = $('.statusbar .dot'), btn = $('[data-action="sync"]');
  if(on) on.textContent = online() ? 'Online (Instant Google Sheets Sync)' : 'Offline Mode (Saved Locally)';
  if(m){ m.textContent = state.syncError ? ('⚠ '+state.syncError) : ''; m.style.color = state.syncError ? '#b45309' : '#047857'; }
  if(ls) ls.textContent = state.lastSyncedAt ? ('Last Synced: '+state.lastSyncedAt) : '';
  if(dot) dot.className = 'dot ' + (syncing ? 'pulse on' : (online() ? 'on' : 'off'));
  if(btn) btn.textContent = syncing ? 'Sync…' : 'Sync';
}
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const s=JSON.parse(raw); state = {...DEFAULT_STATE, ...s}; }
  }catch(e){}
  state.deviceId = deviceId();
}
function persist(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
  }, 300);
}
function setState(fn){
  state = typeof fn==='function' ? fn(state) : fn;
  persist();
  render();
}

/* --------------------------------------------------------- UI app shell */

let tab = 'dashboard';
let view = null; // { name, entry }

const NAV = [
  { id:'dashboard', label:'Dashboard', short:'Home', icon:'◈' },
  { id:'add',       label:'Add Expense', short:'Expense', icon:'−' },
  { id:'income',    label:'Add Income',  short:'Income',  icon:'+' },
  { id:'entries',   label:'Entries',     short:'List',    icon:'☰' },
  { id:'pending',   label:'Pending',     short:'Pending', icon:'⏳' },
  { id:'reports',   label:'Reports',     short:'Stats',   icon:'▦' },
  { id:'settings',  label:'Settings',    short:'More',    icon:'⚙' },
];

function render(){
  const pendingCount = state.expenses.filter(e=>num(e.remainingBalance)>0).length +
                       state.incomes.filter(i=>num(i.remainingBalance)>0).length;
  const html = `
  <div class="wrap">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">MC</div>
        <div>
          <div class="brand-name">MoppChem accounts</div>
          <div class="brand-sub">${online()?'● Online':'○ Offline'}</div>
        </div>
      </div>
      <nav class="nav">
        ${NAV.map(n=>`
          <button class="nav-item ${tab===n.id?'active':''}" data-action="tab" data-tab="${n.id}">
            <span class="lbl"><span class="nav-ic">${n.icon}</span> ${n.label}</span>
            ${n.id==='pending'&&pendingCount>0?`<span class="nav-badge">${pendingCount}</span>`:''}
          </button>`).join('')}
      </nav>
      <div class="sidebar-balance">
        <div class="sb-lbl">Available Balance</div>
        <div class="sb-val">${money(capital())}</div>
        <div class="sb-today">Today Spent: ${money(todaySpent())}</div>
      </div>
    </aside>

    <div class="main">
      <div class="mobile-header no-print">
        <div>
          <div class="brand-name">MoppChem accounts</div>
          <div class="brand-sub">${money(capital())} available</div>
        </div>
        <button class="btn btn-sm" data-action="sync" ${syncing?'disabled':''}>${syncing?'Sync…':'Sync'}</button>
      </div>

      <div class="content">
        <div class="statusbar no-print">
          <span class="dot ${syncing?'pulse on':(online()?'on':'off')}"></span>
          <span class="k-label" id="online-label">${online()?'Online (Instant Google Sheets Sync)':'Offline Mode (Saved Locally)'}</span>
          <span id="sync-msg" class="k-label" style="color:#047857">${state.syncError?'⚠ '+esc(state.syncError):''}</span>
          <span style="margin-left:auto;color:var(--s400)" id="last-sync">${state.lastSyncedAt?('Last Synced: '+state.lastSyncedAt):''}</span>
        </div>
        ${renderTab()}
      </div>
    </div>

    <nav class="bottomnav no-print">
      <div class="row">
        ${NAV.map(n=>`
          <button class="bnav ${tab===n.id?'active':''}" data-action="tab" data-tab="${n.id}">
            <span class="ic">${n.icon}</span>${n.short}
            ${n.id==='pending'&&pendingCount>0?'<span style="position:absolute;top:6px;right:calc(50% - 16px);width:7px;height:7px;border-radius:50%;background:var(--amber)"></span>':''}
          </button>`).join('')}
      </div>
    </nav>
  </div>`;
  $('#app').innerHTML = html;
  renderModal();
  renderPost();
}

/* after a full render, refresh live totals for the active add-form */
function renderPost(){
  if(tab==='add'||tab==='income'){
    const p = tab==='add' ? 'exp' : 'inc';
    if($('#x-'+p+'-base')) updateTot($('#x-'+p+'-base'));
  }
}

function online(){ return navigator.onLine; }

function todaySpent(){
  const d = todayStr();
  let t = 0;
  for(const e of state.expenses){
    if(e.date===d) t += num(e.amountPaid);
    (e.installments||[]).forEach(i=>{ if(i.date===d) t+=num(i.amount); });
    (e.returns||[]).forEach(r=>{ if(r.date===d) t-=num(r.amount); });
  }
  return t;
}

/* ------------------------------------------------------------ main views */

function renderTab(){
  switch(tab){
    case 'dashboard': return viewDashboard();
    case 'add':       return viewAddExpense();
    case 'income':    return viewAddIncome();
    case 'entries':   return viewEntries();
    case 'pending':   return viewPending();
    case 'reports':   return viewReports();
    case 'settings':  return viewSettings();
    default: return '';
  }
}

let tf = 'monthly';
let entriesTab = 'expenses';
let filters = { search:'', cat:'ALL', from:'', to:'',
                isearch:'', icat:'ALL', ifrom:'', ito:'' };
let reportFilter = { start:'', end:'', cat:'ALL' };

/* dashboard */
function viewDashboard(){
  const now = new Date();
  const inRange = it => {
    const d = new Date(it.date);
    if(tf==='daily')  return it.date===todayStr();
    if(tf==='weekly'){ const w=new Date(); w.setDate(now.getDate()-7); return d>=w&&d<=now; }
    if(tf==='monthly') return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();
    if(tf==='yearly')  return d.getFullYear()===now.getFullYear();
    return true;
  };
  const exps = state.expenses.filter(inRange);
  const incs = state.incomes.filter(inRange);
  const total = exps.reduce((s,e)=>s+num(e.amount),0);
  const totalTax = exps.reduce((s,e)=>s+num(e.taxAmount),0);
  const totalUnpaid = exps.reduce((s,e)=>s+num(e.remainingBalance),0);
  const totalIncome = incs.reduce((s,e)=>s+num(e.amount),0);

  const catMap={}; state.categories.forEach(c=>catMap[c]=0);
  exps.forEach(e=>{ catMap[e.category]=(catMap[e.category]||0)+num(e.amount); });
  const breakdown=Object.keys(catMap).map(cat=>({cat,amount:catMap[cat],p:total>0?(catMap[cat]/total*100):0})).sort((a,b)=>b.amount-a.amount);
  const icatMap={}; state.incomeCategories.forEach(c=>icatMap[c]=0);
  incs.forEach(e=>{ icatMap[e.category]=(icatMap[e.category]||0)+num(e.amount); });
  const ibreakdown=Object.keys(icatMap).map(cat=>({cat,amount:icatMap[cat],p:totalIncome>0?(icatMap[cat]/totalIncome*100):0})).sort((a,b)=>b.amount-a.amount);
  const net = totalIncome-total;

  return `
  <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px">

function viewEntriesFilter(which){

function filteredExpenses(){
  const q=filters.search.toLowerCase();
  return state.expenses.filter(e=>{
    const d=new Date(e.date);
    if(filters.from&&d<new Date(filters.from)) return false;
    if(filters.to&&d>new Date(filters.to+'T23:59:59')) return false;
    if(filters.cat!=='ALL'&&e.category!==filters.cat) return false;
    if(q&&!JSON.stringify(e).toLowerCase().includes(q)) return false;
    return true;
  });
}
function filteredIncomes(){
  const q=filters.isearch.toLowerCase();
  return state.incomes.filter(e=>{
    const d=new Date(e.date);
    if(filters.ifrom&&d<new Date(filters.ifrom)) return false;
    if(filters.ito&&d>new Date(filters.ito+'T23:59:59')) return false;
    if(filters.icat!=='ALL'&&e.category!==filters.icat) return false;
    if(q&&!JSON.stringify(e).toLowerCase().includes(q)) return false;
    return true;
  });
}

/* reports */
function viewReports(){
  const start = reportFilter.start?new Date(reportFilter.start):new Date('2000-01-01');
  const end = reportFilter.end?new Date(reportFilter.end):new Date('2100-01-01');
  const rows = state.expenses.filter(e=>{
    const d=new Date(e.date);
    return d>=start && d<=end && (reportFilter.cat==='ALL'||e.category===reportFilter.cat);
  });
  const total=rows.reduce((s,e)=>s+num(e.amount),0), tax=rows.reduce((s,e)=>s+num(e.taxAmount),0);
  const highest=rows.reduce((m,e)=>Math.max(m,num(e.amount)),0);
  const cmap={}; rows.forEach(e=>cmap[e.category]=(cmap[e.category]||0)+num(e.amount));
  let days=1;
  if(reportFilter.start&&reportFilter.end){ days=Math.ceil((end-start)/(86400000))+1; }
  else if(rows.length){ const ds=rows.map(e=>new Date(e.date).getTime()); days=Math.ceil((Math.max(...ds)-Math.min(...ds))/(86400000))+1; }
  const avg=total/(days||1);
  return `
  <div class="card"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px">
    <div><h2 class="page">Detailed Financial Reports</h2><p class="page-sub">Filter and export a statement</p></div>

    <div class="field"><label>End Date</label><input class="inp" type="date" id="r-end" value="${esc(reportFilter.end)}"></div>
    <div class="field" style="grid-column:span 2"><label>Category</label>
      <select class="inp" id="r-cat"><option value="ALL">All Categories</option>${state.categories.map(c=>`<option value="${esc(c)}" ${reportFilter.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
    </div>
  </div></div>
  <div class="grid4" style="margin-top:14px">
    <div class="card"><div class="k-label">Total Spent</div><div class="k-value">${money(total)}</div><div class="k-sub">${rows.length} transactions</div></div>
    <div class="card"><div class="k-label">Tax Breakdown</div><div class="k-value">${money(tax)}</div></div>
    <div class="card"><div class="k-label">Daily Average</div><div class="k-value" style="color:var(--em-600)">${money(avg)}</div><div class="k-sub">Over ${days} days</div></div>
    <div class="card"><div class="k-label">Highest Single Expense</div><div class="k-value">${money(highest)}</div></div>
  </div>`;
}

const syncedSet = {}; // id -> updatedAt (from last known cloud)

function findEntry(id, type){
  const arr = type==='expense'?state.expenses:state.incomes;
  return arr.find(x=>x.id===id);
}

function makeEntry(type, fields, paid){
  const t=Date.now();
  const base=num(fields.base), tax=num(fields.tax);
  const total = type==='expense' ? base+tax : Math.max(0, base-tax);
  const remaining = Math.max(0, total-paid);
  return {
    id: uid(type==='expense'?'exp':'inc'),
    baseAmount: base, taxAmount: tax, amount: total,
    isPartial: remaining>0, paymentMethod: fields.method,
    amountPaid: paid, remainingBalance: remaining,
    category: fields.category, description: fields.desc||'',
    date: fields.date, payee: type==='expense'?fields.person:'', payer: type==='income'?fields.person:'',
    transactionId: fields.txn||'', installments:[], returns:[],
    updatedAt: t, syncedAt: ''
  };
}

function submitAddForm(prefix, e){
  e.preventDefault();
  const isExp = prefix==='exp';
  const base=$('#x-'+prefix+'-base').value;
  const tax=$('#x-'+prefix+'-tax').value;
  const person=$('#x-'+prefix+'-person').value;
  const txn=$('#x-'+prefix+'-txn').value;
  const method=$('#x-'+prefix+'-method').value;
  const cat=$('#x-'+prefix+'-cat').value;
  const date=$('#x-'+prefix+'-date').value;
  const desc=$('#x-'+prefix+'-desc').value;
  const isPartial=!!$('input[name="ptype-'+prefix+'"]:checked') && $('input[name="ptype-'+prefix+'"]:checked').value==='partial';
  const paid = isPartial ? num($('#x-'+prefix+'-paid').value) : null;
  const totalBase=num(base), totalTax=num(tax);
  const total = isExp? totalBase+totalTax : Math.max(0,totalBase-totalTax);
  if(total<=0 && totalBase<=0) return;
  const actualPaid = isPartial ? Math.min(paid, total) : total;
  const entry = makeEntry(isExp?'expense':'income',
    { base, tax, method, category:cat, desc, date, person, txn },
    actualPaid);
  entry.installments = [{ id: uid('inst'), date, timestamp: new Date().toLocaleString(), amount: actualPaid, method, transactionId: txn||'', note:'Initial '+(isExp?'Payment':'Receipt') }];
  draft[prefix] = {};   // clear the form draft after saving
  tab = 'entries';
  entriesTab = isExp?'expenses':'income';
  setState(s=>({ ...s, [isExp?'expenses':'incomes']:[entry, ...(isExp?s.expenses:s.incomes)] }));
  queueSync();
}

    [type==='expense'?'expenses':'incomes']: (type==='expense'?s.expenses:s.incomes).filter(x=>x.id!==id)
  }));

/* ------------------------------------------------------------ SYNC ENGINE */

let syncing=false, syncQueued=false, syncTimer=null;

function setStatus(msg){ state.syncError = msg || ''; updateStatusBar(); }

function queueSync(){
  if(!state.googleSheetsUrl) return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(syncAll, 800);   // debounce burst mutations
}

/* Last-writer-wins reconciliation (pure-ish; works on a copy of tombstones).
   Returns merged lists + the entries/tombstones that must be pushed. */
function reconcile(local, cloud, tombstonesIn){
  const tombstones = {...tombstonesIn};
  const res = { expenses:[], incomes:[], pushExpenses:[], pushIncomes:[], pushDeletes:[],
                tombstones, adoptCapital:false, capitalFromCloud:0, capitalUpdatedFromCloud:0,
                categories:local.categories, incomeCategories:local.incomeCategories,
                adoptCategories:false, adoptIncomeCategories:false };

  function recList(localArr, cloudArr, cloudDeleted, type){
    const cloudMap=new Map(); (cloudArr||[]).forEach(c=>cloudMap.set(c.id,c));
    const deletedMap=new Map(); (cloudDeleted||[]).forEach(d=>deletedMap.set(d.id,d));
    const localMap=new Map(); localArr.forEach(l=>localMap.set(l.id,l));
    const seen=new Set();
    const live=[]; const pushLive=[];

    for(const c of cloudArr){
      const l=localMap.get(c.id);
      const lt=tombstones[c.id];
      if(lt && lt >= (c.updatedAt||0)){
        // local delete is newer than cloud's live copy -> keep it deleted, push tombstone
        res.pushDeletes.push({type,id:c.id,deletedAt:lt});
        seen.add(c.id);
        continue;
      }
      if(!l){ live.push(c); seen.add(c.id); continue; }
      if(lt){ // local delete older than cloud's live copy -> resurrect, adopt cloud
        live.push(c); delete tombstones[c.id]; seen.add(c.id); continue;
      }
      if((l.updatedAt||0) > (c.updatedAt||0)){
        live.push(l); pushLive.push(l);                 // local newer -> keep & push
      } else {
        live.push(c);                                   // cloud newer/equal -> adopt
      }
      seen.add(c.id);
    }
    for(const d of cloudDeleted){
      if(seen.has(d.id)) continue;
      const l=localMap.get(d.id);
      const lt=tombstones[d.id];
      if(l){
        if(lt && lt>=d.deletedAt){ /* already deleted locally */ }
        else if(d.deletedAt >= (l.updatedAt||0)){ tombstones[d.id]=d.deletedAt; } // adopt cloud delete
        else { live.push(l); pushLive.push(l); }         // local alive newer -> keep & push (resurrect)
      } else if(!lt){ /* stays deleted */ }
      seen.add(d.id);
    }
    for(const l of localArr){
      if(seen.has(l.id)) continue;
      if(tombstones[l.id]) res.pushDeletes.push({type,id:l.id,deletedAt:tombstones[l.id]});
      else { live.push(l); pushLive.push(l); }
    }
    return {live, pushLive};
  }

  const e=recList(local.expenses, cloud.expenses, cloud.deletedExpenses, 'expense');
  const i=recList(local.incomes, cloud.incomes, cloud.deletedIncomes, 'income');
  res.expenses=e.live; res.incomes=i.live;
  res.pushExpenses=e.pushLive; res.pushIncomes=i.pushLive;

  // baseCapital last-writer-wins
  if((cloud.capitalUpdatedAt||0) > (local.capitalUpdatedAt||0)){
    res.adoptCapital=true; res.capitalFromCloud=cloud.baseCapital; res.capitalUpdatedFromCloud=cloud.capitalUpdatedAt;
  }
  // categories: union (never lose a category created on another device)
  const cats=union(local.categories, cloud.categories);
  if(!sameArr(cats, local.categories)) res.adoptCategories=true;
  res.categories=cats;
  const icats=union(local.incomeCategories, cloud.incomeCategories);
  if(!sameArr(icats, local.incomeCategories)) res.adoptIncomeCategories=true;
  res.incomeCategories=icats;

  return res;
}

function applyReconcile(state, res){
  state.expenses=res.expenses;
  state.incomes=res.incomes;
  state.tombstones=res.tombstones;
  if(res.adoptCapital){ state.baseCapital=res.capitalFromCloud; state.capitalUpdatedAt=res.capitalUpdatedFromCloud; }
  if(res.adoptCategories){ state.categories=res.categories; state.capitalUpdatedAt=state.capitalUpdatedAt; }
  if(res.adoptIncomeCategories){ state.incomeCategories=res.incomeCategories; }
}

function updateSyncedSet(cloud){
  (cloud.expenses||[]).forEach(x=>syncedSet[x.id]=x.updatedAt);
  (cloud.incomes||[]).forEach(x=>syncedSet[x.id]=x.updatedAt);
}

async function apiGet(){
  const r=await fetch(state.googleSheetsUrl, { method:'GET', cache:'no-store' });
  if(!r.ok) throw new Error('GET '+r.status);
  return r.json();
}
async function apiPost(payload){
  const r=await fetch(state.googleSheetsUrl, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  if(!r.ok) throw new Error('POST '+r.status);
  return r.json();
}

async function syncAll(){
  if(syncing) return;
  if(!state.googleSheetsUrl){ setStatus('Set Google Sheets URL in Settings.'); return; }
  if(!online()){ setStatus('Offline. Will sync when reconnected.'); return; }
  syncing = true; updateStatusBar();
  try{
    const cloud = await apiGet();
    const res = reconcile(state, cloud);
    applyReconcile(state, res);

    // build push payload only if we actually have something newer
    const payload={};
    if(res.pushExpenses.length) payload.expenses=res.pushExpenses;
    if(res.pushIncomes.length) payload.incomes=res.pushIncomes;
    if(res.pushDeletes.length) payload.deletes=res.pushDeletes;

    const capNewer = (state.capitalUpdatedAt||0) > (cloud.capitalUpdatedAt||0);
    if(capNewer){ payload.baseCapital=state.baseCapital; payload.capitalUpdatedAt=state.capitalUpdatedAt; }
    if(!sameArr(state.categories, cloud.categories||[])) payload.categories=state.categories;
    if(!sameArr(state.incomeCategories, cloud.incomeCategories||[])) payload.incomeCategories=state.incomeCategories;

    const hasChanges = payload.expenses||payload.incomes||payload.deletes||payload.baseCapital!==undefined||payload.categories||payload.incomeCategories;

    if(hasChanges){
      const resp = await apiPost(payload);
      if(!resp.ok) throw new Error(resp.error||'server error');
      const res2 = reconcile(state, resp);
      applyReconcile(state, res2);
      updateSyncedSet(resp);
    } else {
      updateSyncedSet(cloud);
    }
    state.lastSyncedAt = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    setStatus('');
    persist();
    // Never rebuild the active view while the user is editing an input.
    if(hasFocusedInput()){ renderEntriesResults(); }
    else render();
  }catch(err){
    setStatus('Sync failed: '+err.message);
    console.error(err);
  }finally{
    syncing = false; updateStatusBar();
  }
}

function handleManualSync(){ syncAll(); }

/* periodic + visibility auto-sync */
setInterval(()=>{ if(online()) syncAll(); }, 20000);
window.addEventListener('focus', ()=>{ if(online()) syncAll(); });
window.addEventListener('online', ()=>{ updateStatusBar(); syncAll(); });
window.addEventListener('offline', ()=>{ updateStatusBar(); });

function generateReport(){
  const start=reportFilter.start?new Date(reportFilter.start):new Date('2000-01-01');
  const end=reportFilter.end?new Date(reportFilter.end):new Date('2100-01-01');
  const rows=state.expenses.filter(e=>{ const d=new Date(e.date); return d>=start&&d<=end&&(reportFilter.cat==='ALL'||e.category===reportFilter.cat); });
  const total=rows.reduce((s,e)=>s+num(e.amount),0), tax=rows.reduce((s,e)=>s+num(e.taxAmount),0);
  const cmap={}; rows.forEach(e=>cmap[e.category]=(cmap[e.category]||0)+num(e.amount));
  const w=window.open('','_blank');
  if(!w){ alert('Please allow popups to print.'); return; }
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>MoppChem Report</title>
    <style>body{font-family:Arial;max-width:900px;margin:0 auto;padding:30px;color:#1e293b}
      h1{font-size:22px;color:#0f172a} .meta{font-size:12px;color:#64748b;margin-bottom:20px}
      table{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px} th,td{border:1px solid #e2e8f0;padding:8px;text-align:left}
      th{background:#0f172a;color:#fff} .r{text-align:right} .sum{display:flex;gap:24px;background:#f1f5f9;padding:14px;border-radius:8px;font-size:13px;flex-wrap:wrap}
      .sum b{font-size:16px}</style></head><body>
    <h1>MoppChem accounts — Financial Report</h1>
    <div class="meta">Generated: ${new Date().toLocaleString()}<br>Category: ${esc(reportFilter.cat)} • Range: ${esc(reportFilter.start||'All time')} to ${esc(reportFilter.end||'Present')}</div>
    <div class="sum"><div>Total Expenditure:<br><b>Rs. ${total.toLocaleString('en-PK')}</b></div><div>Total Tax:<br><b>Rs. ${tax.toLocaleString('en-PK')}</b></div><div>Entries:<br><b>${rows.length}</b></div></div>
    ${reportFilter.cat==='ALL'&&Object.keys(cmap).length?`
    <h3>Category Summary</h3><table><tr><th>Category</th><th class="r">Amount</th><th class="r">Share</th></tr>
    ${Object.keys(cmap).sort((a,b)=>cmap[b]-cmap[a]).map(c=>`<tr><td>${esc(c)}</td><td class="r">Rs. ${cmap[c].toLocaleString('en-PK')}</td><td class="r">${total>0?(cmap[c]/total*100).toFixed(1):0}%</td></tr>`).join('')}</table>`:''}
    <h3>Itemized Transactions</h3>
    <table><tr><th>Date</th><th>Category</th><th>Description</th><th>Method</th><th class="r">Total</th><th class="r">Paid</th><th class="r">Unpaid</th><th class="r">Pays</th></tr>
    ${rows.map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.category)}</td><td>${esc(e.description||'-')}</td><td>${esc(e.paymentMethod||'Cash')}</td><td class="r">Rs. ${num(e.amount).toLocaleString('en-PK')}</td><td class="r">Rs. ${num(e.amountPaid).toLocaleString('en-PK')}</td><td class="r">Rs. ${num(e.remainingBalance).toLocaleString('en-PK')}</td><td class="r">${(e.installments||[]).length||1}</td></tr>`).join('')}
    </table>
  </body></html>`);
  w.document.close(); w.focus(); w.print();
}

/* ------------------------------------------------------------ event delegation */

document.addEventListener('click', (ev)=>{
  const t=ev.target.closest('[data-action]');
  if(!t) return;
  const a=t.dataset.action;
  switch(a){
    case 'tab': tab=t.dataset.tab; render(); break;
    case 'tf': tf=t.dataset.v; render(); break;
    case 'entries-tab': entriesTab=t.dataset.v; render(); break;
    case 'sync': syncAll(); break;
    case 'edit-bal':
      setState(s=>({...s, editingBal:true, tempBal:num(capital())}));
      setTimeout(()=>{ const i=$('#bal-inp'); if(i){i.focus(); i.select();} },30); break;
    case 'save-bal':
      setBaseCapital($('#bal-inp').value); setState(s=>({...s, editingBal:false})); break;
    case 'edit': {
      const en=findEntry(t.dataset.id,t.dataset.type);
      draft.edit={ base:en.baseAmount, tax:en.taxAmount, person:(en.type==='expense'?en.payee:en.payer)||'', txn:en.transactionId||'',
        method:en.paymentMethod||'Cash', cat:en.category, date:en.date, desc:en.description||'',
        isPartial:!!en.isPartial, paid:en.amountPaid||0 };
      modal={name:'edit', entry:en, type:t.dataset.type}; renderModal(); break;
    }
    case 'settle': {
      const en=findEntry(t.dataset.id,t.dataset.type);
      draft.settle={ amt:en.remainingBalance||0, method:'Cash', txn:'' };
      modal={name:'settle', entry:en, type:t.dataset.type}; renderModal(); break;
    }
    case 'return': {
      const en=findEntry(t.dataset.id,t.dataset.type);
      draft.ret={ amt:'', date:todayStr(), person:'', reason:'', method:'Cash', txn:'', comments:'' };
      modal={name:'return', entry:en, type:t.dataset.type}; renderModal(); break;
    }
    case 'history':
      view=modal={name:'history', entry:findEntry(t.dataset.id,t.dataset.type), type:t.dataset.type}; renderModal(); break;
    case 'print':
      printReceipt(findEntry(t.dataset.id,t.dataset.type), t.dataset.type); break;
    case 'delete': deleteEntry(t.dataset.id, t.dataset.type); break;
    case 'close': closeModal(); break;
    case 'delcat': removeCategory(t.dataset.v, false); break;
    case 'delinc': removeCategory(t.dataset.v, true); break;
    case 'gen-report': generateReport(); break;
    case 'save-url': {
      const url=$('#sheets-url').value.trim();
      setState(s=>({...s, googleSheetsUrl:url}));
      if(url){ queueSync(); setStatus(''); }
      else alert('URL cleared.');
      break;
    }
    case 'clear-local':
      if(confirm('Clear ALL local data? (Cloud copy in Sheets is untouched.)')){
        localStorage.removeItem(LS_KEY);
        location.reload();
      }
      break;
  }
});

// radio toggles (show partial boxes) + persist draft for selects/radios
document.addEventListener('change', (ev)=>{
  const r=ev.target.closest('[data-radio]');
  if(r){
    const parts=r.dataset.radio.split('-'); // [scope, mode] e.g. ['exp','partial']
    const scope=parts[0], mode=parts[1];
    if(!draft[scope]) draft[scope]={};
    draft[scope].isPartial = (mode==='partial');
    const box=$('#x-'+scope+'-partialbox');
    if(box){ box.classList.toggle('hide', mode!=='partial'); updateTot($('#x-'+scope+'-base')); }
    return;
  }
  if(ev.target.matches('input[name="ed-ptype"]')){
    draft.edit = draft.edit||{};
    draft.edit.isPartial = ev.target.value==='partial';
    const box=$('#ed-partialbox'); box.classList.toggle('hide', ev.target.value!=='partial');
    return;
  }
  if(ev.target.dataset && ev.target.dataset.draft){ putDraft(ev.target); }
});

// generic delegated input events for add-form totals, draft persistence & filters
document.addEventListener('input', (ev)=>{
  const form = ev.target.closest('[data-form]');
  if(form){
    const name = form.dataset.form;
    if(name==='exp'||name==='inc'){
      putDraft(ev.target);   // remember the keystroke so a re-render can't wipe it
      const last = ev.target.id ? ev.target.id.split('-').pop() : '';
      if(last==='base'||last==='tax'||last==='paid') updateTot($('#x-'+name+'-base'));
    } else if(name==='edit'||name==='settle'||name==='return'){
      putDraft(ev.target);
    }
    return;
  }
  if(ev.target.matches('#bal-inp')){ /* handled by save */ return; }
  // filters — update only the results list so the input keeps focus
  if(ev.target.matches('[data-search="exp"]')){ filters.search=ev.target.value; renderEntriesResults(); }
  if(ev.target.matches('[data-search="inc"]')){ filters.isearch=ev.target.value; renderEntriesResults(); }
  if(ev.target.matches('[data-date-from="exp"]')){ filters.from=ev.target.value; renderEntriesResults(); }
  if(ev.target.matches('[data-date-to="exp"]')){ filters.to=ev.target.value; renderEntriesResults(); }
  if(ev.target.matches('[data-date-from="inc"]')){ filters.ifrom=ev.target.value; renderEntriesResults(); }
  if(ev.target.matches('[data-date-to="inc"]')){ filters.ito=ev.target.value; renderEntriesResults(); }
  if(ev.target.matches('[data-cat="exp"]')){ filters.cat=ev.target.value; renderEntriesResults(); }
  if(ev.target.matches('[data-cat="inc"]')){ filters.icat=ev.target.value; renderEntriesResults(); }
  if(ev.target.id==='r-start'){ reportFilter.start=ev.target.value; renderIfSafe(); }
  if(ev.target.id==='r-end'){ reportFilter.end=ev.target.value; renderIfSafe(); }
  if(ev.target.id==='r-cat'){ reportFilter.cat=ev.target.value; renderIfSafe(); }
});

function updateTot(baseInp){
  const p=baseInp?baseInp.id.split('-')[1]:null;
  if(!p) return;
  const isExp=p==='exp';
  const base=num($('#x-'+p+'-base').value), tax=num($('#x-'+p+'-tax').value);
  const total=isExp?base+tax:Math.max(0,base-tax);
  const box=$('#x-'+p+'-tot');
  const isPartial=!!$('input[name="ptype-'+p+'"]:checked')&&$('input[name="ptype-'+p+'"]:checked').value==='partial';
  const paid=isPartial?num($('#x-'+p+'-paid').value):total;
  const remain=Math.max(0,total-paid);
  box.innerHTML=`<div class="row"><span>Total ${isExp?'Expense (Base+Tax)':'Net Income (Gross-Tax)'}:</span><span style="font-weight:700;color:#0f172a">${money(total)}</span></div>`+
    (isPartial?`<div class="row" style="color:#b45309"><span>Remaining Balance:</span><span style="font-weight:700">${money(remain)}</span></div>`:'');
}

document.addEventListener('submit', (ev)=>{
  ev.preventDefault();
  const form=ev.target.closest('[data-form]');
  if(!form) return;
  const name=form.dataset.form;
  if(name==='exp'||name==='inc'){ submitAddForm(name, ev); return; }
  if(name==='edit'){ if(modal) submitEdit(modal.entry, modal.type); return; }
  if(name==='settle'){ if(modal) submitSettle(modal.entry, modal.type); return; }
  if(name==='return'){ if(modal) submitReturn(modal.entry, modal.type); return; }
  if(name==='addcat'){ addCategory(false); return; }
  if(name==='addinc'){ addCategory(true); return; }
});

// Enter in balance input
document.addEventListener('keydown', (ev)=>{
  if(ev.target.id==='bal-inp' && ev.key==='Enter'){
    setBaseCapital(ev.target.value); setState(s=>({...s, editingBal:false}));
  }
});

function closeModal(){ modal=null; renderModal(); }

function addCategory(isIncome){
  const inp=isIncome?$('#newinc'):$('#newcat');
  const val=(inp.value||'').trim();
  if(!val) return;
  const arr=isIncome?state.incomeCategories:state.categories;
  if(arr.some(c=>c.toLowerCase()===val.toLowerCase())){ alert('Category already exists.'); return; }
  if(!isIncome && state.categories.length>=30){ alert('Too many categories.'); return; }
  setState(s=>({ ...s, [isIncome?'incomeCategories':'categories']:[...arr,val] }));
  queueSync();
}
function removeCategory(cat, isIncome){
  const arr=isIncome?state.incomeCategories:state.categories;
  if(arr.length<=1){ alert('You must keep at least one category.'); return; }
  if(!confirm('Remove category "'+cat+'"?')) return;
  setState(s=>({ ...s, [isIncome?'incomeCategories':'categories']:arr.filter(c=>c!==cat) }));
  queueSync();
}

/* ---------------------------------------------------------------- boot */

loadState();
render();
if(state.googleSheetsUrl && online()) syncAll();
</script>
</body>
</html>
